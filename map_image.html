<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#000000">

<title>Venue Map</title>

<style>

:root{
    color-scheme:dark;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:#000;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial, Helvetica, sans-serif;

    padding:20px;

}

/* Container */

.container{

    width:100%;

    max-width:900px;

}

/* Image */

.image-container{

    position:relative;

    border-radius:24px;

    overflow:hidden;

    box-shadow:
    0 25px 80px rgba(0,0,0,.55);

    filter:brightness(1.15);

}

.image-container img{

    width:100%;

    display:block;

    border-radius:24px;

}

/* ============================
   CLOSE BUTTON
============================ */

.close-button{

    position:absolute;

    top:18px;

    right:18px;

    width:48px;

    height:48px;

    border:none;

    border-radius:50%;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(12px);

    -webkit-backdrop-filter:blur(12px);

    color:#fff;

    font-size:28px;

    cursor:pointer;

    display:flex;

    justify-content:center;

    align-items:center;

    transition:.3s;

    z-index:10;

    box-shadow:
    0 5px 15px rgba(0,0,0,.35);

    -webkit-tap-highlight-color:transparent;

    outline:none;

}

.close-button:hover{

    background:rgba(255,255,255,.2);

    transform:scale(1.1);

}

.close-button:active{

    transform:scale(.95);

}

/* ============================
   TRANSPARENT LINKS
============================ */

.location-link{

    position:absolute;

    display:block;

    background:transparent;

    cursor:pointer;

    z-index:50;

}

/* Church */

.church-location{

    left:35.3%;
    top:42.6%;

    width:25%;
    height:3%;

}

/* Reception */

.reception-location{

    left:35.3%;
    top:66.1%;

    width:25%;
    height:3%;

}

/* Uncomment while adjusting hotspots */

/*
.location-link{
    background:red;
    opacity:.35;
}
*/

/* ============================
   MOBILE
============================ */

@media(max-width:600px){

    body{

        padding:10px;

    }

    .close-button{

        width:42px;

        height:42px;

        font-size:24px;

        top:12px;

        right:12px;

    }

}

</style>

</head>

<body>

<div class="container">

    <div class="image-container">

        <button
            class="close-button"
            onclick="window.location.href='video.html'">
            &times;
        </button>

        <img src="map_image.jpeg" alt="Venue Map">

        <!-- Church -->

        <a
            class="location-link church-location"
            href="https://www.google.com/maps/search/?api=1&query=St.+Joseph+Forane+Church+Kodakara"
            target="_blank">

        </a>

        <!-- Reception -->

        <a
            class="location-link reception-location"
            href="https://www.google.com/maps/search/?api=1&query=Royal+Garden+Kuttikkad+Kerala"
            target="_blank">

        </a>

    </div>

</div>

<script src="music.js"></script>
<script src="petals.js"></script>
<script>
  window.addEventListener('load', function () {
    window.initBackgroundMusic(false);
  });
</script>
</body>
</html>
